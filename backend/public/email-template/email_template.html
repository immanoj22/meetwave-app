<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title></title>
  <!-- <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap"
    rel="stylesheet" /> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <style type="text/css">
    body {
      background-color: #1e1e1e;
      color: #fff !important;
    }

    p {
      margin-top: 0px;
      margin-bottom: 0px;
      color: #fff !important;
    }

    h5,
    h3 {
      margin-top: 20px;
      margin-bottom: 20px;
      color: #fff !important;
    }

    .footer {
      display: flex;
      margin-top: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .parg {
      margin-top: 50px;
      margin-bottom: 54px;
      padding: 0 24px;
      text-align: left;
    }

    .parg1 {
      margin-top: 10px;
      margin-bottom: 14px;
      padding: 0 24px;
      text-align: left;
    }



    .subul li {
      margin-top: 10px;
    }

    .train {
      background-repeat: no-repeat;
      /* background-size:auto;
    height: 100%; */
      background-size: 100%;
      height: 100%;
    }

    .er {
      background: url('http://localhost:8008/zarc/curve.svg');
      background-repeat: no-repeat;
      /* background-size:auto;
    height: 100%; */
      background-size: 100%;
      height: 100%;
    }

    .otp_p {
      display: flex;
      justify-content: center;
    }

    .otp_p p {
      border: 2px solid #66adf2;
      width: 50px;
      height: 50px;
      margin-bottom: 0px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 25px;
      margin-left: 15px;
      margin-top: 0px !important;
      font-weight: 700;
    }

    .btn {
      display: inline-block;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      border: 1px solid transparent;
      padding: 8px 30px;
      font-size: 1rem;
      line-height: 1.5;
      border-radius: 0.25rem;
      transition: color .15s ease-in-out,
        background-color .15s ease-in-out, border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }

    .btn-primary {
      color: #fff;
      background-color: #66adf2;
      border-color: #66adf2;
      cursor: pointer;
      font-weight: 600;
      border-radius: 20px;
      font-size: 19px;
    }

    .received {
      color: #66adf2;
    }

    @media(max-width:575px) {

      .parg {
        margin-top: 30px;
        margin-bottom: 0px;
      }

      .footer {
        display: block;
      }

      .footer span {
        margin-top: 10px;
        display: block;
      }

      .toptxt {
        font-size: 12px;
        font-weight: bolder;
      }
    }
   #mail{
    color: #fff !important; 
   }
    table,
    td,
    div,
    h1,
    p {
      /* font-family: 'Poppins', sans-serif; */
      font-family: "Outfit", sans-serif;
      font-size: 15px;
      color: #fff;
    }
  </style>
</head>

<body style="margin:0;padding:0;">

<table class="train1" role="presentation"
  style="width:100%;border-collapse:collapse;border:0;border-spacing:0;margin:20px 0px;background-color:#1e1e1e;">
  <tbody>
    <tr>
      <td align="center" style="padding:0;">

        <table class="train" role="presentation"
          style="max-width:602px;min-width:602px;border-collapse:collapse;;border-spacing:0;text-align:left;">
          <tbody>

            <tr align="center"
              style="display: flex;justify-content: center;align-items: center;padding: 0px 0px;background-color: #0F0E13;border-top-left-radius: 20px;border-top-right-radius: 20px;">

              <td align="center" border=" 0" cellpadding="0" cellspacing="0"
                style="vertical-align: middle;width:100%;padding-top:30px;padding-bottom:30px;">

                <!-- <img alt="" height="auto" src="./logo.png" style="margin-left:auto;margin-right:auto" width="180px" /> -->
                <img alt="" height="auto" src=[[sitelogo]] style="margin-left:auto;margin-right:auto" width="180px" />

              </td>

            </tr>

            <tr>
              <td align="center" border="0" cellpadding="0" cellspacing="0"
                style="padding-top:20px;padding-bottom:20px;background: #0F0E13;">
                <!-- <img src="./banner.png" style="max-width: 450px;" /> -->
                <img src=[[emaillogo]] style="max-width: 450px;" />
              </td>

            </tr>


            <tr>
              <td align="" border="0" cellpadding="0" cellspacing="0" style="padding:30px;background: #0F0E13;">
                <p style="font-size:24px;font-weight: 700;text-align: center;color:#fff;text-transform:uppercase;">
                  Welcome to Meetwave</p>
              </td>
            </tr>

            <tr style="color: #fff;">
              <td
                style="text-align: start;padding:10px 30px 30px 30px;background: #0F0E13;border-bottom-left-radius: 20px;border-bottom-right-radius: 20px;color: #fff;">
                <p style="font-size:16px;font-weight: 800;font-size: 20px;color: #fff;">Dear [[username]]</p>
                <p style="font-size:15px;color: #fff !important;padding-top: 15px;">[[feature]]</p>
                <p style="font-size:15px;color: #fff !important;padding-top: 15px;">[[content]]</p>
                <p style="font-size:16px;font-weight: 700;padding-top: 30px;color: #fff;">Thanks & Regards</p>
                <p style="font-size:14px;padding-top: 10px;color: #fff;">Team Meetwave</p>
              </td>
            </tr>
      </td>
    </tr>
  </tbody>
</table>
</body>
</html>
